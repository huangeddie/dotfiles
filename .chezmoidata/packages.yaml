# Declarative package manifest.

machineRolePolicy:
  required: ["base"]
  platforms:
    linux: ["base", "gaming"]
    darwin: ["base"]

packages:
  bun:
    global:
      roles:
        base:
          [
            "prettier",
            "@earendil-works/pi-coding-agent",
            "hunkdiff",
          ]
  darwin:
    custom:
      roles:
        base: []
    taps:
      roles:
        base: ["modem-dev/tap"]
    # Homebrew refuses to load formulae from third-party taps unless they are
    # trusted. Scoped per-formula rather than per-tap, so formulae added to a
    # tap later are not implicitly authorized.
    trusted_formulae:
      roles:
        base: ["modem-dev/tap/hunk"]
    # On darwin this list is AUTHORITATIVE: `chezmoi apply` runs `brew bundle`
    # with `install --force-cleanup`, so any Homebrew package NOT listed here is
    # uninstalled. Adding a package here installs it; removing it uninstalls it.
    # Dependencies of listed packages are retained automatically.
    brews:
      roles:
        base:
          [
            # Search
            "bat",
            "fd",
            "fzf",
            "zoxide",
            # Text editors
            "neovim",
            "universal-ctags",
            # Version-control
            "modem-dev/tap/hunk",
            "git-delta",
            "gh",
            "chezmoi",
            "jj",
            "jjui",
            "lazygit",
            # Languages
            "rust-analyzer",
            "stylua",
            "swiftformat",
            "zig",
            "python",
            # Package managers
            "node",
            "bun",
            "uv",
            "mise",
            # Libraries
            "gmp",
            "libyaml",
            "openssl@3",
            "cloudflared",
            "ffmpeg",
            "vips",
            # Terminal
            "herdr",
            "television",
            "btop",
          ]
    casks:
      roles:
        base:
          [
            "codex",
            "font-jetbrains-mono-nerd-font",
            "gcloud-cli",
            "ghostty",
          ]
  linux:
    custom:
      roles:
        base:
          - name: television
            executable: tv
            install: |-
              curl -fsSL https://alexpasmantier.github.io/television/install.sh | bash
          - name: zoxide
            executable: zoxide
            install: |-
              curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh
          - name: herdr
            executable: herdr
            install: |-
              curl -fsSL https://herdr.dev/install.sh | sh
          - name: tailscale
            executable: tailscale
            install: |-
              curl -fsSL https://tailscale.com/install.sh | sh
          - name: bun
            executable: bun
            setup: |-
              export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
              export PATH="$BUN_INSTALL/bin:$PATH"
            install: |-
              curl -fsSL https://bun.com/install | bash
    # On linux, apt roles declare desired packages and apt.remove contains
    # durable removal tombstones. Move a retired package from a role to remove;
    # packages absent from both lists are left untouched. Apt-calculated orphan
    # dependencies are purged automatically.
    apt:
      roles:
        base:
          [
            # Search
            "bat",
            "ripgrep",
            "fd-find",
            "fzf",
            # Text Editors
            "neovim",
            # Version control
            "git",
            "lazygit",
            "gh",
            "git-delta",
            # Languages
            "golang-go",
            # Libraries
            "curl",
            "openssh-server",
            "ffmpeg",
            # Package managers
            "nodejs",
            "npm",
            # Terminal
            "btop",
            "nvtop",
            "ghostty",
          ]
        gaming:
          [
            "steam-installer",
            "steam-devices",
          ]
      remove: []
