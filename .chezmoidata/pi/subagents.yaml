      pi: read, grep, find, ls
      claude: Read, Grep, Glob, WebSearch, WebFetch
    reviewer:
      pi: read, grep, find, ls, bash
      claude: Read, Grep, Glob, Bash, WebSearch, WebFetch
    worker:
      pi: null
      claude: Read, Write, Edit, Glob, Grep, Bash, WebSearch, WebFetch
