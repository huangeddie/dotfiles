[metadata]
name = "todoist"
description = "Search, open, and complete Todoist tasks with single-level undo"
requirements = ["td", "bun", "todoist-add"]

[source]
# Ctrl+S switches tabs. Project scope is configured in ../todoist.toml.
command = [
  { name = "Scheduled", run = 'bun "${XDG_CONFIG_HOME:-$HOME/.config}/television/todoist.ts" scheduled' },
  { name = "Backlog", run = 'bun "${XDG_CONFIG_HOME:-$HOME/.config}/television/todoist.ts" backlog' },
]
# Keep the helper's chronological order rather than ranking by fuzzy score/history.
no_sort = true
ansi = true
output = "{strip_ansi|split:\t:1}"

[preview]
command = "id='{strip_ansi|split:\t:1}'; [ -z \"$id\" ] || td --no-spinner task view \"id:$id\" --raw"

[keybindings]
enter = "actions:open"
ctrl-d = ["actions:complete", "reload_source"]
ctrl-z = ["actions:undo", "reload_source"]
ctrl-a = ["actions:create", "reload_source"]

[actions.create]
description = "Create task"
command = "todoist-add"
mode = "fork"

[actions.open]
description = "Open task in Todoist"
command = "ids='{split:\n:..|map:{strip_ansi|split:\t:1}|join: }'; [ -z \"$ids\" ] || td --no-spinner task browse \"id:$ids\""
separator = "\n"
mode = "execute"

[actions.complete]
description = "Complete task"
# Extract each ID before joining so multi-selection never interpolates task text.
command = "bun \"${XDG_CONFIG_HOME:-$HOME/.config}/television/actions.ts\" complete '{split:\n:..|map:{strip_ansi|split:\t:1}|join: }'"
separator = "\n"
mode = "fork"

[actions.undo]
description = "Undo last completion"
command = 'bun "${XDG_CONFIG_HOME:-$HOME/.config}/television/actions.ts" undo'
mode = "fork"
