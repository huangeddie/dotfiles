onboarding = false
[keys]
prefix = "ctrl+space"
new_workspace = "ctrl+alt+shift+n"
focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]
new_tab = ["prefix+c", "ctrl+alt+n"]
previous_tab = ["prefix+p", "ctrl+alt+h"]
next_tab = ["prefix+n", "ctrl+alt+l"]
split_vertical = ["prefix+v"]
split_horizontal = ["prefix+minus"]
zoom = ["prefix+z", "ctrl+alt+z"]
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"

[theme]
name = "catppuccin"
auto_switch = true

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
[[keys.command]]
key = "ctrl+alt+v"
type = "popup"
command = "\"$HOME/.local/bin/vcsui\""
description = "run lazygit or jj UI"
width = "100%"
height = "100%"

[[keys.command]]
key = "ctrl+alt+d"
type = "popup"
command = "hunk show"
description = "show diff (hunk)"
width = "100%"
height = "100%"

